name: Optional online Tencent CAPTCHA smoke

on:
  workflow_dispatch:
    inputs:
      matcher_ref:
        description: Optional matcher SemVer tag or full commit; blank checks capture only
        required: false
        default: ""
        type: string
      wait_seconds:
        description: Seconds to observe activity after capture-ready
        required: true
        default: "8"
        type: string

# This smoke reaches a mutable third-party endpoint, so it is manual-only and
# is not a release or branch protection gate. It receives no repository secrets.
permissions:
  contents: read

concurrency:
  group: online-tcaptcha-smoke-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  OPENSSL_NO_VENDOR: "1"

jobs:
  smoke:
    name: Authorized SMZDM / Tencent capture
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout selected Obscura revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libssl-dev llvm-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Run deterministic offline smoke self-check
        run: python3 scripts/ci/tencent_captcha_online_smoke.py --self-test

      - name: Build Obscura with rendering and stealth
        run: cargo build --locked --release -p obscura-cli --bin obscura --features render,stealth

      - name: Validate optional matcher revision
        if: inputs.matcher_ref != ''
        shell: bash
        env:
          MATCHER_REF: ${{ inputs.matcher_ref }}
        run: |
          set -euo pipefail
          commit='^[0-9a-fA-F]{40}$'
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$MATCHER_REF" =~ $commit && ! "$MATCHER_REF" =~ $semver ]]; then
            echo "matcher_ref must be a full commit SHA or a v-prefixed SemVer tag" >&2
            exit 1
          fi

      - name: Checkout optional matcher revision
        if: inputs.matcher_ref != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: vvhh2002/ai_slide_matcher
          ref: ${{ inputs.matcher_ref }}
          path: matcher-source
          persist-credentials: false

      - name: Build optional ai_slide_matcher
        if: inputs.matcher_ref != ''
        run: |
          CARGO_TARGET_DIR="$RUNNER_TEMP/ai-slide-matcher-target" \
            cargo build --locked --release --manifest-path matcher-source/Cargo.toml

      - name: Capture and inspect the authorized target
        shell: bash
        env:
          MATCHER_REF: ${{ inputs.matcher_ref }}
          WAIT_SECONDS: ${{ inputs.wait_seconds }}
        run: |
          set -euo pipefail
          matcher_args=()
          if [[ -n "$MATCHER_REF" ]]; then
            matcher_args=(--matcher "$RUNNER_TEMP/ai-slide-matcher-target/release/ai_slide_matcher")
          fi
          python3 scripts/ci/tencent_captcha_online_smoke.py \
            --obscura target/release/obscura \
            --stealth \
            --work-dir "$RUNNER_TEMP/obscura-tcaptcha-smoke" \
            --report "$RUNNER_TEMP/obscura-tcaptcha-report.json" \
            --timeout 60 \
            --wait "$WAIT_SECONDS" \
            "${matcher_args[@]}"

      - name: Upload sanitized smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-tcaptcha-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/obscura-tcaptcha-report.json
          if-no-files-found: warn
          retention-days: 7

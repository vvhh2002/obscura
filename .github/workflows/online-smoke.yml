name: Optional online Tencent CAPTCHA smoke

on:
  workflow_dispatch:
    inputs:
      matcher_ref:
        description: Optional full matcher commit SHA; blank checks capture only
        required: false
        default: ""
        type: string
      wait_seconds:
        description: Seconds to observe activity after capture-ready
        required: true
        default: "8"
        type: string

# This smoke reaches a mutable third-party endpoint, so it is manual-only and
# is not a release or branch protection gate. The optional matcher checkout
# receives only its repository-scoped read token.
permissions:
  contents: read

concurrency:
  group: online-tcaptcha-smoke-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  OPENSSL_NO_VENDOR: "1"

jobs:
  smoke:
    name: Authorized SMZDM / Tencent capture
    environment: ai-slide-matcher-release
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout selected Obscura revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libssl-dev llvm-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Run deterministic offline smoke self-check
        run: python3 scripts/ci/tencent_captcha_online_smoke.py --self-test

      - name: Build Obscura with rendering and stealth
        run: cargo build --locked --release -p obscura-cli --bin obscura --features render,stealth

      - name: Validate optional matcher revision
        if: inputs.matcher_ref != ''
        shell: bash
        env:
          MATCHER_REF: ${{ inputs.matcher_ref }}
        run: |
          set -euo pipefail
          commit='^[0-9a-f]{40}$'
          if [[ ! "$MATCHER_REF" =~ $commit ]]; then
            echo "matcher_ref must be a lowercase full commit SHA" >&2
            exit 1
          fi

      - name: Require optional matcher read credential
        if: inputs.matcher_ref != ''
        shell: bash
        env:
          MATCHER_TOKEN: ${{ secrets.AI_SLIDE_MATCHER_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MATCHER_TOKEN" ]]; then
            echo "AI_SLIDE_MATCHER_READ_TOKEN must grant Contents: Read on vvhh2002/ai_slide_matcher" >&2
            exit 1
          fi

      - name: Checkout optional matcher revision
        if: inputs.matcher_ref != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: vvhh2002/ai_slide_matcher
          ref: ${{ inputs.matcher_ref }}
          path: matcher-source
          token: ${{ secrets.AI_SLIDE_MATCHER_READ_TOKEN }}
          persist-credentials: false

      - name: Verify optional matcher revision
        if: inputs.matcher_ref != ''
        shell: bash
        env:
          MATCHER_REF: ${{ inputs.matcher_ref }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C matcher-source rev-parse 'HEAD^{commit}')"
          if [[ "$actual_sha" != "$MATCHER_REF" ]]; then
            echo "Checked out matcher $actual_sha, expected $MATCHER_REF" >&2
            exit 1
          fi

      - name: Install optional matcher toolchain
        if: inputs.matcher_ref != ''
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build optional ai_slide_matcher
        if: inputs.matcher_ref != ''
        working-directory: matcher-source
        env:
          AI_SLIDE_MATCHER_BUILD_NUMBER: ${{ github.run_id }}
          CARGO_TARGET_DIR: ../matcher-target
        run: |
          set -euo pipefail
          private_log="$RUNNER_TEMP/ai-slide-matcher-online-build.log"
          if ! cargo +1.98.0 build --locked --release --bin ai_slide_matcher \
            >"$private_log" 2>&1; then
            echo "Private matcher build failed; source diagnostics are withheld from this public log" >&2
            exit 1
          fi
          echo "Private matcher build passed"

      - name: Capture and inspect the authorized target
        shell: bash
        env:
          MATCHER_REF: ${{ inputs.matcher_ref }}
          WAIT_SECONDS: ${{ inputs.wait_seconds }}
        run: |
          set -euo pipefail
          matcher_args=()
          if [[ -n "$MATCHER_REF" ]]; then
            matcher_args=(--matcher "$GITHUB_WORKSPACE/matcher-target/release/ai_slide_matcher")
          fi
          python3 scripts/ci/tencent_captcha_online_smoke.py \
            --obscura target/release/obscura \
            --stealth \
            --work-dir "$RUNNER_TEMP/obscura-tcaptcha-smoke" \
            --report "$RUNNER_TEMP/obscura-tcaptcha-report.json" \
            --timeout 60 \
            --wait "$WAIT_SECONDS" \
            "${matcher_args[@]}"

      - name: Upload sanitized smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: online-tcaptcha-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/obscura-tcaptcha-report.json
          if-no-files-found: warn
          retention-days: 7

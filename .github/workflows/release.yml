name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version (for example 0.2.0 or v0.2.0)
        required: true
        type: string
      mode:
        description: Build artifacts only, or publish a release after the builds pass
        required: true
        default: build
        type: choice
        options:
          - build
          - publish

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Keep the matcher source and product build number immutable together. The
  # build number is the pinned commit timestamp so rebuilding an Obscura tag
  # does not create differently named matcher assets.
  AI_SLIDE_MATCHER_BUILD_NUMBER: "1788194189"
  AI_SLIDE_MATCHER_REF: 132a833b72a6593d04f7400315ec82100d261d8c
  AI_SLIDE_MATCHER_VERSION: 0.1.0+build.1788194189
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve release revision
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      create_tag: ${{ steps.release.outputs.create_tag }}
      generate_notes: ${{ steps.release.outputs.generate_notes }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout selected revision and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate release request
        id: release
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            if [[ "$tag" != v* ]]; then
              tag="v$tag"
            fi
            case "$INPUT_MODE" in
              build)
                publish=false
                create_tag=false
                generate_notes=false
                ;;
              publish)
                publish=true
                create_tag=true
                generate_notes=true
                ;;
              *)
                echo "Unknown release mode: $INPUT_MODE" >&2
                exit 1
                ;;
            esac
          else
            tag="$GITHUB_REF_NAME"
            publish=true
            create_tag=false
            generate_notes=false
          fi

          semver_core='(0|[1-9][0-9]*)'
          semver_pre='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^v${semver_core}\.${semver_core}\.${semver_core}(-${semver_pre}(\.${semver_pre})*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          if [[ ! "$tag" =~ $semver ]]; then
            echo "Release version must be SemVer, for example 0.2.0 or v0.2.0: $tag" >&2
            exit 1
          fi

          sha="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$sha" != "$GITHUB_SHA" ]]; then
            echo "Checked out $sha, expected workflow revision $GITHUB_SHA" >&2
            exit 1
          fi

          existing_sha="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
          if [[ -n "$existing_sha" && "$existing_sha" != "$sha" ]]; then
            echo "Tag $tag already exists at $existing_sha, but the selected revision is $sha." >&2
            echo "Choose a new version or select the commit already tagged as $tag." >&2
            exit 1
          fi
          if [[ "$publish" == "true" && -z "$existing_sha" && "$create_tag" != "true" ]]; then
            echo "Tag $tag is missing and this trigger is not allowed to create it." >&2
            exit 1
          fi

          version="${tag#v}"
          version_without_build="${version%%+*}"
          prerelease=false
          if [[ "$version_without_build" == *-* ]]; then
            prerelease=true
          fi

          printf 'create_tag=%s\n' "$create_tag" >> "$GITHUB_OUTPUT"
          printf 'generate_notes=%s\n' "$generate_notes" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "$prerelease" >> "$GITHUB_OUTPUT"
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

          if [[ -n "$existing_sha" ]]; then
            echo "Building existing tag $tag at $sha"
          elif [[ "$create_tag" == "true" ]]; then
            echo "Building $tag at $sha; the missing tag will be created after all builds pass"
          else
            echo "Building candidate tag $tag at $sha without publishing"
          fi

      - name: Check vendored dependency licenses and provenance
        run: python3 scripts/ci/check_vendor_licenses.py

  test:
    name: Release / Tests
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      NO_PROXY: 127.0.0.1,localhost
      OPENSSL_NO_VENDOR: "1"
    steps:
      - name: Checkout resolved release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Verify resolved release revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Checked out $actual_sha, expected resolved release revision $EXPECTED_SHA" >&2
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libssl-dev llvm-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: nextest
          fallback: none

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: false

      - name: Test performance threshold policy
        run: python3 -m unittest discover -s scripts/ci -p 'test_perf_smoke.py'

      - name: Test binary-only matcher release policy
        run: python3 -m unittest discover -s scripts/ci -p 'test_verify_matcher_binary_release.py'

      - name: Test public matcher smoke sanitizer
        run: python3 -m unittest discover -s scripts/ci -p 'test_sanitize_matcher_smoke.py'

      - name: Run focused document-loading regressions
        run: |
          cargo nextest run --locked --release --features render \
            -p obscura-js -p obscura-browser -p obscura-cdp \
            -E 'test(streaming_frame_blocking_script_cannot_see_parser_tail) | test(streaming_frame_external_defer_runs_at_eof_in_encounter_order) | test(parser_defer_classics_execute_in_encounter_order) | test(replacement_cancels_unfinished_committed_document_exactly_once) | test(capture_ready_reports_transport_failure_but_accepts_complete_http_error) | test(replacing_navigation_aborts_each_old_active_request_once_before_generation_reset) | test(raw_commit_returns_page_for_immediate_runtime_while_body_tail_streams) | test(raw_commit_keeps_blocking_script_and_stylesheet_fetches_alive_while_streaming_events)' \
            --no-fail-fast

      - name: Run full render release suite
        # This intentionally follows the small focused gate. Cargo reuses the
        # release-mode compilation, so only the focused test processes repeat.
        run: cargo nextest run --locked --release --features render --no-fail-fast

  matcher_test:
    name: Release / ai_slide_matcher source tests
    needs: prepare
    environment: ai-slide-matcher-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require private matcher read credential
        shell: bash
        env:
          MATCHER_TOKEN: ${{ secrets.AI_SLIDE_MATCHER_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MATCHER_TOKEN" ]]; then
            echo "AI_SLIDE_MATCHER_READ_TOKEN must grant Contents: Read on vvhh2002/ai_slide_matcher" >&2
            exit 1
          fi

      - name: Checkout pinned ai_slide_matcher source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: vvhh2002/ai_slide_matcher
          ref: ${{ env.AI_SLIDE_MATCHER_REF }}
          path: matcher-source
          token: ${{ secrets.AI_SLIDE_MATCHER_READ_TOKEN }}
          persist-credentials: false

      - name: Verify pinned matcher revision
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git -C matcher-source rev-parse 'HEAD^{commit}')"
          if [[ "$actual_sha" != "$AI_SLIDE_MATCHER_REF" ]]; then
            echo "Checked out matcher $actual_sha, expected $AI_SLIDE_MATCHER_REF" >&2
            exit 1
          fi

      - name: Install pinned matcher Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Run locked matcher and packaging tests
        working-directory: matcher-source
        env:
          CARGO_TARGET_DIR: ../matcher-test-target
        run: |
          set -euo pipefail
          private_log="$RUNNER_TEMP/ai-slide-matcher-source-tests.log"
          if ! cargo +1.98.0 test --locked --all-targets --all-features \
            >"$private_log" 2>&1; then
            echo "Private matcher Rust tests failed; source diagnostics are withheld from this public log" >&2
            exit 1
          fi
          if ! python3 -m unittest tests/test_release_packaging.py \
            >>"$private_log" 2>&1; then
            echo "Private matcher packaging tests failed; source diagnostics are withheld from this public log" >&2
            exit 1
          fi
          echo "Private matcher source and packaging tests passed"

  matcher_build:
    name: Release / ai_slide_matcher / ${{ matrix.id }}
    needs: [prepare, matcher_test]
    environment: ai-slide-matcher-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64-musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            executable: ai_slide_matcher
            architecture: x86_64
          - id: linux-arm64-musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            executable: ai_slide_matcher
            architecture: aarch64
          - id: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: ai_slide_matcher
            architecture: x86_64
          - id: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            executable: ai_slide_matcher
            architecture: arm64
          - id: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            executable: ai_slide_matcher.exe
            architecture: x86_64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Require private matcher read credential
        shell: bash
        env:
          MATCHER_TOKEN: ${{ secrets.AI_SLIDE_MATCHER_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MATCHER_TOKEN" ]]; then
            echo "AI_SLIDE_MATCHER_READ_TOKEN must grant Contents: Read on vvhh2002/ai_slide_matcher" >&2
            exit 1
          fi

      - name: Checkout resolved Obscura sanitizer revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
          # Keep the public policy checkout and private Cargo package as
          # siblings. A private checkout nested below the Obscura Cargo
          # workspace is rejected as an undeclared workspace member.
          path: obscura-policy

      - name: Preserve LF files in the private Windows checkout
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout pinned ai_slide_matcher source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: vvhh2002/ai_slide_matcher
          ref: ${{ env.AI_SLIDE_MATCHER_REF }}
          path: matcher-source
          token: ${{ secrets.AI_SLIDE_MATCHER_READ_TOKEN }}
          persist-credentials: false

      - name: Verify pinned matcher revision
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git -C matcher-source rev-parse 'HEAD^{commit}')"
          if [[ "$actual_sha" != "$AI_SLIDE_MATCHER_REF" ]]; then
            echo "Checked out matcher $actual_sha, expected $AI_SLIDE_MATCHER_REF" >&2
            exit 1
          fi

      - name: Install pinned matcher Rust toolchain and target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add --toolchain 1.98.0 ${{ matrix.target }}

      - name: Install native musl linker
        if: startsWith(matrix.id, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils musl-tools

      - name: Run native matcher release tests (Unix)
        if: runner.os != 'Windows'
        working-directory: matcher-source
        env:
          CARGO_TARGET_DIR: ../matcher-target
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          set -euo pipefail
          private_log="$RUNNER_TEMP/ai-slide-matcher-native-tests.log"
          if ! cargo +1.98.0 test --release --locked --target ${{ matrix.target }} \
            >"$private_log" 2>&1; then
            echo "Private matcher native tests failed; source diagnostics are withheld from this public log" >&2
            exit 1
          fi
          echo "Private matcher native tests passed"

      - name: Run native matcher release tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: matcher-source
        env:
          CARGO_TARGET_DIR: ../matcher-target
        run: |
          $privateLog = Join-Path $env:RUNNER_TEMP "ai-slide-matcher-native-tests.log"
          cargo +1.98.0 test --release --locked --target ${{ matrix.target }} *> $privateLog
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Private matcher native tests failed; source diagnostics are withheld from this public log"
            exit 1
          }
          Write-Host "Private matcher native tests passed"

      - name: Build and smoke matcher release binary (Unix)
        if: runner.os != 'Windows'
        working-directory: matcher-source
        env:
          CARGO_TARGET_DIR: ../matcher-target
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          set -euo pipefail
          private_log="$RUNNER_TEMP/ai-slide-matcher-native-build.log"
          if ! cargo +1.98.0 build --release --locked --bin ai_slide_matcher \
            --target ${{ matrix.target }} >"$private_log" 2>&1; then
            echo "Private matcher native build failed; source diagnostics are withheld from this public log" >&2
            exit 1
          fi
          mkdir -p target/release-output/${{ matrix.id }} target/private-smoke-results
          cp ../matcher-target/${{ matrix.target }}/release/${{ matrix.executable }} \
            target/release-output/${{ matrix.id }}/
          cp LICENSE THIRD_PARTY_NOTICES target/release-output/${{ matrix.id }}/
          if ! rustc +1.98.0 scripts/native_smoke.rs -O -o target/native-smoke \
            >>"$private_log" 2>&1; then
            echo "Private matcher smoke harness build failed; source diagnostics are withheld from this public log" >&2
            exit 1
          fi
          if ! target/native-smoke \
            target/release-output/${{ matrix.id }}/${{ matrix.executable }} \
            target/private-smoke-results/${{ matrix.id }}.json \
            ${{ matrix.id }} >>"$private_log" 2>&1; then
            echo "Private matcher native smoke failed; source diagnostics are withheld from this public log" >&2
            exit 1
          fi
          echo "Private matcher native build and smoke passed"

      - name: Build and smoke matcher release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: matcher-source
        env:
          CARGO_TARGET_DIR: ../matcher-target
        run: |
          $privateLog = Join-Path $env:RUNNER_TEMP "ai-slide-matcher-native-build.log"
          cargo +1.98.0 build --release --locked --bin ai_slide_matcher --target ${{ matrix.target }} *> $privateLog
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Private matcher native build failed; source diagnostics are withheld from this public log"
            exit 1
          }
          New-Item -ItemType Directory -Force target/release-output/${{ matrix.id }}, target/private-smoke-results | Out-Null
          Copy-Item ../matcher-target/${{ matrix.target }}/release/${{ matrix.executable }} target/release-output/${{ matrix.id }}/
          Copy-Item -Path LICENSE, THIRD_PARTY_NOTICES -Destination target/release-output/${{ matrix.id }}/
          rustc +1.98.0 scripts/native_smoke.rs -O -o target/native-smoke.exe *>> $privateLog
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Private matcher smoke harness build failed; source diagnostics are withheld from this public log"
            exit 1
          }
          target/native-smoke.exe `
            target/release-output/${{ matrix.id }}/${{ matrix.executable }} `
            target/private-smoke-results/${{ matrix.id }}.json `
            ${{ matrix.id }} *>> $privateLog
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Private matcher native smoke failed; source diagnostics are withheld from this public log"
            exit 1
          }
          Write-Host "Private matcher native build and smoke passed"

      - name: Verify static Linux matcher artifact
        if: startsWith(matrix.id, 'linux-')
        working-directory: matcher-source
        run: |
          set -euo pipefail
          private_log="$RUNNER_TEMP/ai-slide-matcher-linux-abi.log"
          if ! bash scripts/check_static_linux.sh \
            target/release-output/${{ matrix.id }}/${{ matrix.executable }} \
            ${{ matrix.architecture }} >"$private_log" 2>&1; then
            echo "Private matcher Linux ABI check failed; diagnostics are withheld from this public log" >&2
            exit 1
          fi
          echo "Private matcher Linux ABI check passed"

      - name: Verify macOS matcher artifact
        if: startsWith(matrix.id, 'macos-')
        working-directory: matcher-source
        run: |
          set -euo pipefail
          private_log="$RUNNER_TEMP/ai-slide-matcher-macos-abi.log"
          if ! bash scripts/check_macos_binary.sh \
            target/release-output/${{ matrix.id }}/${{ matrix.executable }} \
            ${{ matrix.architecture }} >"$private_log" 2>&1; then
            echo "Private matcher macOS ABI check failed; diagnostics are withheld from this public log" >&2
            exit 1
          fi
          echo "Private matcher macOS ABI check passed"

      - name: Verify Windows matcher artifact
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: matcher-source
        run: |
          $privateLog = Join-Path $env:RUNNER_TEMP "ai-slide-matcher-windows-abi.log"
          ./scripts/check_windows_binary.ps1 `
            -Binary target/release-output/${{ matrix.id }}/${{ matrix.executable }} *> $privateLog
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Private matcher Windows ABI check failed; diagnostics are withheld from this public log"
            exit 1
          }
          Write-Host "Private matcher Windows ABI check passed"

      - name: Sanitize native matcher smoke result with public policy
        shell: bash
        run: |
          set -euo pipefail
          python_cmd=python3
          command -v "$python_cmd" >/dev/null || python_cmd=python
          "$python_cmd" obscura-policy/scripts/ci/sanitize_matcher_smoke.py \
            --input matcher-source/target/private-smoke-results/${{ matrix.id }}.json \
            --output matcher-smoke-results/${{ matrix.id }}.json \
            --target ${{ matrix.id }} \
            --version "$AI_SLIDE_MATCHER_VERSION"

      - name: Verify native matcher upload file set
        shell: bash
        run: |
          set -euo pipefail
          root="matcher-source/target/release-output/${{ matrix.id }}"
          python_cmd=python3
          command -v "$python_cmd" >/dev/null || python_cmd=python
          "$python_cmd" obscura-policy/scripts/ci/verify_matcher_binary_release.py \
            --staging "$root" \
            --executable ${{ matrix.executable }}

      - name: Upload native matcher binary and legal notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.id }}
          path: |
            matcher-source/target/release-output/${{ matrix.id }}/${{ matrix.executable }}
            matcher-source/target/release-output/${{ matrix.id }}/LICENSE
            matcher-source/target/release-output/${{ matrix.id }}/THIRD_PARTY_NOTICES
          if-no-files-found: error
          retention-days: 7

      - name: Upload native matcher smoke result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: matcher-smoke-${{ matrix.id }}
          path: matcher-smoke-results/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 7

  matcher_package:
    name: Release / Package ai_slide_matcher
    needs: [prepare, test, matcher_test, matcher_build]
    environment: ai-slide-matcher-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private matcher read credential
        shell: bash
        env:
          MATCHER_TOKEN: ${{ secrets.AI_SLIDE_MATCHER_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$MATCHER_TOKEN" ]]; then
            echo "AI_SLIDE_MATCHER_READ_TOKEN must grant Contents: Read on vvhh2002/ai_slide_matcher" >&2
            exit 1
          fi

      - name: Checkout resolved Obscura verifier revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Checkout pinned ai_slide_matcher source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: vvhh2002/ai_slide_matcher
          ref: ${{ env.AI_SLIDE_MATCHER_REF }}
          path: matcher-source
          token: ${{ secrets.AI_SLIDE_MATCHER_READ_TOKEN }}
          persist-credentials: false

      - name: Verify pinned matcher revision
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git -C matcher-source rev-parse 'HEAD^{commit}')"
          if [[ "$actual_sha" != "$AI_SLIDE_MATCHER_REF" ]]; then
            echo "Checked out matcher $actual_sha, expected $AI_SLIDE_MATCHER_REF" >&2
            exit 1
          fi

      - name: Download native matcher binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binary-*
          path: matcher-source/target/release-input

      - name: Download native matcher smoke results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: matcher-smoke-*
          path: matcher-source/target/all-smoke-results
          merge-multiple: true

      - name: Compare matcher results across platforms
        working-directory: matcher-source
        run: |
          set -euo pipefail
          private_log="$RUNNER_TEMP/ai-slide-matcher-compare.log"
          if ! python3 scripts/compare_smoke_manifests.py target/all-smoke-results \
            >"$private_log" 2>&1; then
            echo "Private matcher cross-platform comparison failed; source diagnostics are withheld from this public log" >&2
            exit 1
          fi
          echo "Private matcher cross-platform outputs agree"

      - name: Resolve matcher release version
        id: matcher_version
        shell: bash
        working-directory: matcher-source
        run: |
          set -euo pipefail
          private_log="$RUNNER_TEMP/ai-slide-matcher-version.log"
          if ! version="$(python3 scripts/resolve_release_version.py \
            --requested '' \
            --build-number "$AI_SLIDE_MATCHER_BUILD_NUMBER" 2>"$private_log")"; then
            echo "Private matcher version resolution failed; source diagnostics are withheld from this public log" >&2
            exit 1
          fi
          if [[ "$version" != "$AI_SLIDE_MATCHER_VERSION" ]]; then
            echo "Private matcher version differs from the pinned public release version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "Packaging ai_slide_matcher $version from $AI_SLIDE_MATCHER_REF"

      - name: Package and verify binary matcher archives
        working-directory: matcher-source
        env:
          MATCHER_VERSION: ${{ steps.matcher_version.outputs.version }}
        run: |
          set -euo pipefail
          private_log="$RUNNER_TEMP/ai-slide-matcher-package.log"
          if ! python3 scripts/package_release.py \
            --input target/release-input \
            --output ../matcher-release \
            --version "$MATCHER_VERSION" \
            --source-date-epoch 0 >"$private_log" 2>&1; then
            echo "Private matcher packaging failed; source diagnostics are withheld from this public log" >&2
            exit 1
          fi
          if ! python3 scripts/verify_release_archives.py \
            --input target/release-input \
            --archives ../matcher-release \
            --version "$MATCHER_VERSION" \
            --extract-linux-x64 ../matcher-release-verify \
            >>"$private_log" 2>&1; then
            echo "Private matcher archive verification failed; source diagnostics are withheld from this public log" >&2
            exit 1
          fi
          if ! ../matcher-release-verify/ai_slide_matcher --version \
            >>"$private_log" 2>&1; then
            echo "Packaged matcher execution failed" >&2
            exit 1
          fi
          # The private repository's implementation-documentation bundle is
          # verified locally but is not an authorized public artifact.
          rm "../matcher-release/ai_slide_matcher-v${MATCHER_VERSION}-documentation.zip"

      - name: Record pinned matcher build provenance
        shell: bash
        env:
          MATCHER_VERSION: ${{ steps.matcher_version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "repository=https://github.com/vvhh2002/ai_slide_matcher" \
            "commit=$AI_SLIDE_MATCHER_REF" \
            "rust_toolchain=1.98.0" \
            "version=$MATCHER_VERSION" \
            > matcher-release/ai_slide_matcher-PROVENANCE.txt

      - name: Publish sanitized matcher test report
        shell: bash
        env:
          MATCHER_VERSION: ${{ steps.matcher_version.outputs.version }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "vvhh2002/ai_slide_matcher" \
            --arg commit "$AI_SLIDE_MATCHER_REF" \
            --arg version "$MATCHER_VERSION" \
            '{
              schema_version: 1,
              repository: $repository,
              commit: $commit,
              version: $version,
              source_code_included: false,
              gates: {
                locked_source_tests: "passed",
                packaging_tests: "passed",
                native_release_tests: "passed",
                native_functional_smoke: "passed",
                cross_platform_determinism: "passed",
                platform_abi_checks: "passed",
                binary_archive_verification: "passed"
              },
              native_targets: [
                "x86_64-unknown-linux-musl",
                "aarch64-unknown-linux-musl",
                "x86_64-apple-darwin",
                "aarch64-apple-darwin",
                "x86_64-pc-windows-msvc"
              ]
            }' > matcher-release/ai_slide_matcher-TEST-REPORT.json
          {
            echo "### ai_slide_matcher public release gate"
            echo
            echo "- Revision: \`$AI_SLIDE_MATCHER_REF\`"
            echo "- Version: \`$MATCHER_VERSION\`"
            echo "- Source/packaging tests: passed"
            echo "- Five-platform native tests, adapter smoke, determinism, and ABI checks: passed"
            echo "- Public source files: none"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate matcher release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd matcher-release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS

      - name: Independently verify binary-only matcher release
        shell: bash
        env:
          MATCHER_VERSION: ${{ steps.matcher_version.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_matcher_binary_release.py \
            --archives matcher-release \
            --version "$MATCHER_VERSION" \
            --commit "$AI_SLIDE_MATCHER_REF"

      - name: Upload packaged matcher releases
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-ai-slide-matcher
          path: |
            matcher-release/SHA256SUMS
            matcher-release/ai_slide_matcher-PROVENANCE.txt
            matcher-release/ai_slide_matcher-TEST-REPORT.json
            matcher-release/ai_slide_matcher-v${{ steps.matcher_version.outputs.version }}-aarch64-apple-darwin.tar.gz
            matcher-release/ai_slide_matcher-v${{ steps.matcher_version.outputs.version }}-aarch64-unknown-linux-musl.tar.gz
            matcher-release/ai_slide_matcher-v${{ steps.matcher_version.outputs.version }}-x86_64-apple-darwin.tar.gz
            matcher-release/ai_slide_matcher-v${{ steps.matcher_version.outputs.version }}-x86_64-pc-windows-msvc.zip
            matcher-release/ai_slide_matcher-v${{ steps.matcher_version.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # Build on Ubuntu 22.04 so the Linux release binary works on
            # common LTS servers with glibc 2.35 instead of requiring the
            # newer glibc shipped by ubuntu-latest.
            os: ubuntu-22.04
            name: obscura-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            # Native build on GitHub's ARM runner.
            os: ubuntu-22.04-arm
            name: obscura-aarch64-linux
          - target: aarch64-apple-darwin
            os: macos-latest
            name: obscura-aarch64-macos
          - target: x86_64-apple-darwin
            # Must run on a native Intel runner. obscura-js bakes a V8 startup
            # snapshot at build time, and that snapshot is architecture specific.
            # macos-latest is Apple Silicon, so building x86_64 there embeds an
            # arm64 snapshot into the Intel binary and V8 crashes deserializing
            # it at isolate init (issue #290). macos-15-intel is the last x86_64
            # image (available until Aug 2027); there is no cross-build that
            # produces a correct snapshot.
            os: macos-15-intel
            name: obscura-x86_64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: obscura-x86_64-windows

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    env:
      OBSCURA_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout resolved release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install stealth build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev

      - name: Configure libclang (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Use one coherent SDK. A hard-coded CommandLineTools include path can
          # mix libc++ headers with the selected Xcode SDK and break BoringSSL.
          XCODE_PATH="$(xcode-select -p)"
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDKROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-isystem $SDK_PATH/usr/include/c++/v1" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$XCODE_PATH/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Configure libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build no-render release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p obscura-cli --bins --no-default-features

      - name: Stage no-render release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release
          mkdir -p dist/no-render
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/no-render/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/no-render/
          fi

      - name: Build no-render stealth release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p obscura-cli --bins --no-default-features --features stealth

      - name: Stage no-render stealth release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release
          mkdir -p dist/no-render-stealth
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/no-render-stealth/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/no-render-stealth/
          fi

      - name: Build render-enabled release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p obscura-cli --bins --features render

      - name: Stage default release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release
          mkdir -p dist/default
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/default/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/default/
          fi

      - name: Build render-enabled stealth release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p obscura-cli --bins --features render,stealth

      - name: Stage stealth release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release
          mkdir -p dist/stealth
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/stealth/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/stealth/
          fi

      - name: Stage Chinese user manual
        shell: bash
        run: |
          set -euo pipefail
          for variant in default stealth no-render no-render-stealth; do
            cp docs/User-Guide.zh-CN.md \
              "dist/$variant/obscura-user-guide-zh-CN.md"
          done

      - name: Smoke test release binaries (V8 snapshot)
        # Run the V8 path once so a release never ships a binary that crashes at
        # isolate init from a mismatched snapshot (issue #290). The data: URL
        # keeps it offline. Every target here is native, so the runner can
        # execute all variants it just built.
        shell: bash
        run: |
          for VARIANT in default stealth no-render no-render-stealth; do
            BIN=dist/$VARIANT/obscura
            [ -f "$BIN.exe" ] && BIN="$BIN.exe"
            "$BIN" fetch "data:text/html,<title>ok</title>" --eval "1+1"
          done
          for VARIANT in default stealth; do
            BIN=dist/$VARIANT/obscura
            [ -f "$BIN.exe" ] && BIN="$BIN.exe"
            "$BIN" fetch "data:text/html,<style>body{margin:0;background:%23123456}</style>" --screenshot smoke.png
            test -s smoke.png
            rm smoke.png
          done
          for VARIANT in no-render no-render-stealth; do
            BIN=dist/$VARIANT/obscura
            [ -f "$BIN.exe" ] && BIN="$BIN.exe"
            if "$BIN" fetch "data:text/html,<title>no-render</title>" --screenshot smoke.png; then
              echo "$VARIANT unexpectedly supports screenshots" >&2
              exit 1
            fi
            test ! -e smoke.png
          done

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar czf ${{ matrix.name }}.tar.gz -C dist/default \
            obscura obscura-worker obscura-user-guide-zh-CN.md
          tar czf ${{ matrix.name }}-stealth.tar.gz -C dist/stealth \
            obscura obscura-worker obscura-user-guide-zh-CN.md
          tar czf ${{ matrix.name }}-no-render.tar.gz -C dist/no-render \
            obscura obscura-worker obscura-user-guide-zh-CN.md
          tar czf ${{ matrix.name }}-no-render-stealth.tar.gz -C dist/no-render-stealth \
            obscura obscura-worker obscura-user-guide-zh-CN.md

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist/default
          7z a ../../${{ matrix.name }}.zip obscura.exe obscura-worker.exe obscura-user-guide-zh-CN.md
          cd ../stealth
          7z a ../../${{ matrix.name }}-stealth.zip obscura.exe obscura-worker.exe obscura-user-guide-zh-CN.md
          cd ../no-render
          7z a ../../${{ matrix.name }}-no-render.zip obscura.exe obscura-worker.exe obscura-user-guide-zh-CN.md
          cd ../no-render-stealth
          7z a ../../${{ matrix.name }}-no-render-stealth.zip obscura.exe obscura-worker.exe obscura-user-guide-zh-CN.md

      - name: Upload packaged binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}-stealth.tar.gz
            ${{ matrix.name }}-no-render.tar.gz
            ${{ matrix.name }}-no-render-stealth.tar.gz
            ${{ matrix.name }}.zip
            ${{ matrix.name }}-stealth.zip
            ${{ matrix.name }}-no-render.zip
            ${{ matrix.name }}-no-render-stealth.zip
          if-no-files-found: error
          retention-days: 7

  documentation:
    name: Release / Chinese user manual
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout resolved release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Verify and stage Chinese user manual
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Checked out $actual_sha, expected resolved release revision $EXPECTED_SHA" >&2
            exit 1
          fi
          test -s docs/User-Guide.zh-CN.md
          cp docs/User-Guide.zh-CN.md obscura-user-guide-zh-CN.md

      - name: Upload Chinese user manual
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-documentation
          path: obscura-user-guide-zh-CN.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, test, matcher_package, build, documentation]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # This job never checks out or executes repository code. The write token is
      # available only while collecting and publishing the completed artifacts.
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify collected public release file set
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          expected="$RUNNER_TEMP/obscura-release-files.expected"
          actual="$RUNNER_TEMP/obscura-release-files.actual"
          printf '%s\n' \
            "SHA256SUMS" \
            "ai_slide_matcher-PROVENANCE.txt" \
            "ai_slide_matcher-TEST-REPORT.json" \
            "ai_slide_matcher-v${AI_SLIDE_MATCHER_VERSION}-aarch64-apple-darwin.tar.gz" \
            "ai_slide_matcher-v${AI_SLIDE_MATCHER_VERSION}-aarch64-unknown-linux-musl.tar.gz" \
            "ai_slide_matcher-v${AI_SLIDE_MATCHER_VERSION}-x86_64-apple-darwin.tar.gz" \
            "ai_slide_matcher-v${AI_SLIDE_MATCHER_VERSION}-x86_64-pc-windows-msvc.zip" \
            "ai_slide_matcher-v${AI_SLIDE_MATCHER_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            "obscura-aarch64-linux-no-render-stealth.tar.gz" \
            "obscura-aarch64-linux-no-render.tar.gz" \
            "obscura-aarch64-linux-stealth.tar.gz" \
            "obscura-aarch64-linux.tar.gz" \
            "obscura-aarch64-macos-no-render-stealth.tar.gz" \
            "obscura-aarch64-macos-no-render.tar.gz" \
            "obscura-aarch64-macos-stealth.tar.gz" \
            "obscura-aarch64-macos.tar.gz" \
            "obscura-user-guide-zh-CN.md" \
            "obscura-x86_64-linux-no-render-stealth.tar.gz" \
            "obscura-x86_64-linux-no-render.tar.gz" \
            "obscura-x86_64-linux-stealth.tar.gz" \
            "obscura-x86_64-linux.tar.gz" \
            "obscura-x86_64-macos-no-render-stealth.tar.gz" \
            "obscura-x86_64-macos-no-render.tar.gz" \
            "obscura-x86_64-macos-stealth.tar.gz" \
            "obscura-x86_64-macos.tar.gz" \
            "obscura-x86_64-windows-no-render-stealth.zip" \
            "obscura-x86_64-windows-no-render.zip" \
            "obscura-x86_64-windows-stealth.zip" \
            "obscura-x86_64-windows.zip" \
            | sort > "$expected"
          if [[ -n "$(find . -mindepth 1 -maxdepth 1 ! -type f -print -quit)" ]]; then
            echo "Collected release contains a non-file entry" >&2
            exit 1
          fi
          find . -mindepth 1 -maxdepth 1 -type f -print \
            | sed 's#^./##' \
            | sort > "$actual"
          if ! cmp -s "$expected" "$actual"; then
            echo "Collected release file set differs from the public allowlist" >&2
            exit 1
          fi

      - name: Revalidate or create release tag
        shell: bash
        env:
          ALLOW_CREATE_TAG: ${{ needs.prepare.outputs.create_tag }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          error_file="$RUNNER_TEMP/release-tag-error"
          if ! ref_json="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              2>"$error_file"
          )"; then
            if [[ "$ALLOW_CREATE_TAG" == "true" ]] \
              && grep -q 'HTTP 404' "$error_file"; then
              create_error="$RUNNER_TEMP/release-tag-create-error"
              if gh api --method POST \
                "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" \
                -f sha="$EXPECTED_SHA" \
                >/dev/null 2>"$create_error"; then
                echo "Created tag $RELEASE_TAG at $EXPECTED_SHA"
              elif grep -q 'HTTP 422' "$create_error"; then
                echo "Tag $RELEASE_TAG was created concurrently; validating it"
              else
                cat "$create_error" >&2
                exit 1
              fi
              ref_json="$(
                gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
              )"
            else
              cat "$error_file" >&2
              exit 1
            fi
          fi

          object_type="$(jq -er '.object.type' <<<"$ref_json")"
          object_sha="$(jq -er '.object.sha' <<<"$ref_json")"
          for _ in {1..16}; do
            [[ "$object_type" == "commit" ]] && break
            if [[ "$object_type" != "tag" ]]; then
              echo "Tag $RELEASE_TAG resolves to unsupported object type $object_type" >&2
              exit 1
            fi
            tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -er '.object.type' <<<"$tag_json")"
            object_sha="$(jq -er '.object.sha' <<<"$tag_json")"
          done

          if [[ "$object_type" != "commit" || "$object_sha" != "$EXPECTED_SHA" ]]; then
            echo "Tag $RELEASE_TAG changed while building: expected $EXPECTED_SHA, got $object_type $object_sha" >&2
            exit 1
          fi
          echo "Tag $RELEASE_TAG still resolves to $EXPECTED_SHA"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS

      - name: Decide whether to generate release notes
        id: release_metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REQUEST_GENERATE_NOTES: ${{ needs.prepare.outputs.generate_notes }}
        run: |
          set -euo pipefail

          generate_notes=false
          if [[ "$REQUEST_GENERATE_NOTES" == "true" ]]; then
            error_file="$RUNNER_TEMP/release-lookup-error"
            if gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              >/dev/null 2>"$error_file"; then
              echo "Updating an existing release without regenerating its notes"
            elif grep -q 'HTTP 404' "$error_file"; then
              generate_notes=true
              echo "A new release will receive generated notes"
            else
              cat "$error_file" >&2
              exit 1
            fi
          fi
          printf 'generate_notes=%s\n' "$generate_notes" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          fail_on_unmatched_files: true
          files: dist/*
          generate_release_notes: ${{ steps.release_metadata.outputs.generate_notes }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}

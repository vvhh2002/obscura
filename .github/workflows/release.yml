name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version (for example 0.2.0 or v0.2.0)
        required: true
        type: string
      mode:
        description: Build artifacts only, or publish a release after the builds pass
        required: true
        default: build
        type: choice
        options:
          - build
          - publish

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve release revision
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      create_tag: ${{ steps.release.outputs.create_tag }}
      generate_notes: ${{ steps.release.outputs.generate_notes }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish: ${{ steps.release.outputs.publish }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout selected revision and tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate release request
        id: release
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            if [[ "$tag" != v* ]]; then
              tag="v$tag"
            fi
            case "$INPUT_MODE" in
              build)
                publish=false
                create_tag=false
                generate_notes=false
                ;;
              publish)
                publish=true
                create_tag=true
                generate_notes=true
                ;;
              *)
                echo "Unknown release mode: $INPUT_MODE" >&2
                exit 1
                ;;
            esac
          else
            tag="$GITHUB_REF_NAME"
            publish=true
            create_tag=false
            generate_notes=false
          fi

          semver_core='(0|[1-9][0-9]*)'
          semver_pre='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          semver="^v${semver_core}\.${semver_core}\.${semver_core}(-${semver_pre}(\.${semver_pre})*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          if [[ ! "$tag" =~ $semver ]]; then
            echo "Release version must be SemVer, for example 0.2.0 or v0.2.0: $tag" >&2
            exit 1
          fi

          sha="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$sha" != "$GITHUB_SHA" ]]; then
            echo "Checked out $sha, expected workflow revision $GITHUB_SHA" >&2
            exit 1
          fi

          existing_sha="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
          if [[ -n "$existing_sha" && "$existing_sha" != "$sha" ]]; then
            echo "Tag $tag already exists at $existing_sha, but the selected revision is $sha." >&2
            echo "Choose a new version or select the commit already tagged as $tag." >&2
            exit 1
          fi
          if [[ "$publish" == "true" && -z "$existing_sha" && "$create_tag" != "true" ]]; then
            echo "Tag $tag is missing and this trigger is not allowed to create it." >&2
            exit 1
          fi

          version="${tag#v}"
          version_without_build="${version%%+*}"
          prerelease=false
          if [[ "$version_without_build" == *-* ]]; then
            prerelease=true
          fi

          printf 'create_tag=%s\n' "$create_tag" >> "$GITHUB_OUTPUT"
          printf 'generate_notes=%s\n' "$generate_notes" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "$prerelease" >> "$GITHUB_OUTPUT"
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

          if [[ -n "$existing_sha" ]]; then
            echo "Building existing tag $tag at $sha"
          elif [[ "$create_tag" == "true" ]]; then
            echo "Building $tag at $sha; the missing tag will be created after all builds pass"
          else
            echo "Building candidate tag $tag at $sha without publishing"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            # Build on Ubuntu 22.04 so the Linux release binary works on
            # common LTS servers with glibc 2.35 instead of requiring the
            # newer glibc shipped by ubuntu-latest.
            os: ubuntu-22.04
            name: obscura-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            # Native build on GitHub's ARM runner.
            os: ubuntu-22.04-arm
            name: obscura-aarch64-linux
          - target: aarch64-apple-darwin
            os: macos-latest
            name: obscura-aarch64-macos
          - target: x86_64-apple-darwin
            # Must run on a native Intel runner. obscura-js bakes a V8 startup
            # snapshot at build time, and that snapshot is architecture specific.
            # macos-latest is Apple Silicon, so building x86_64 there embeds an
            # arm64 snapshot into the Intel binary and V8 crashes deserializing
            # it at isolate init (issue #290). macos-15-intel is the last x86_64
            # image (available until Aug 2027); there is no cross-build that
            # produces a correct snapshot.
            os: macos-15-intel
            name: obscura-x86_64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: obscura-x86_64-windows

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    env:
      OBSCURA_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout resolved release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install stealth build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev llvm-dev

      - name: Configure libclang (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Use one coherent SDK. A hard-coded CommandLineTools include path can
          # mix libc++ headers with the selected Xcode SDK and break BoringSSL.
          XCODE_PATH="$(xcode-select -p)"
          SDK_PATH="$(xcrun --show-sdk-path)"
          echo "SDKROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-isystem $SDK_PATH/usr/include/c++/v1" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$XCODE_PATH/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      - name: Configure libclang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build no-render release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p obscura-cli --bins --no-default-features

      - name: Stage no-render release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release
          mkdir -p dist/no-render
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/no-render/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/no-render/
          fi

      - name: Build no-render stealth release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p obscura-cli --bins --no-default-features --features stealth

      - name: Stage no-render stealth release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release
          mkdir -p dist/no-render-stealth
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/no-render-stealth/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/no-render-stealth/
          fi

      - name: Build render-enabled release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p obscura-cli --bins --features render

      - name: Stage default release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release
          mkdir -p dist/default
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/default/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/default/
          fi

      - name: Build render-enabled stealth release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p obscura-cli --bins --features render,stealth

      - name: Stage stealth release binary
        shell: bash
        run: |
          BIN_DIR=target/${{ matrix.target }}/release
          mkdir -p dist/stealth
          if [ -f "$BIN_DIR/obscura.exe" ]; then
            cp "$BIN_DIR/obscura.exe" "$BIN_DIR/obscura-worker.exe" dist/stealth/
          else
            cp "$BIN_DIR/obscura" "$BIN_DIR/obscura-worker" dist/stealth/
          fi

      - name: Smoke test release binaries (V8 snapshot)
        # Run the V8 path once so a release never ships a binary that crashes at
        # isolate init from a mismatched snapshot (issue #290). The data: URL
        # keeps it offline. Every target here is native, so the runner can
        # execute all variants it just built.
        shell: bash
        run: |
          for VARIANT in default stealth no-render no-render-stealth; do
            BIN=dist/$VARIANT/obscura
            [ -f "$BIN.exe" ] && BIN="$BIN.exe"
            "$BIN" fetch "data:text/html,<title>ok</title>" --eval "1+1"
          done
          for VARIANT in default stealth; do
            BIN=dist/$VARIANT/obscura
            [ -f "$BIN.exe" ] && BIN="$BIN.exe"
            "$BIN" fetch "data:text/html,<style>body{margin:0;background:%23123456}</style>" --screenshot smoke.png
            test -s smoke.png
            rm smoke.png
          done
          for VARIANT in no-render no-render-stealth; do
            BIN=dist/$VARIANT/obscura
            [ -f "$BIN.exe" ] && BIN="$BIN.exe"
            if "$BIN" fetch "data:text/html,<title>no-render</title>" --screenshot smoke.png; then
              echo "$VARIANT unexpectedly supports screenshots" >&2
              exit 1
            fi
            test ! -e smoke.png
          done

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar czf ${{ matrix.name }}.tar.gz -C dist/default obscura obscura-worker
          tar czf ${{ matrix.name }}-stealth.tar.gz -C dist/stealth obscura obscura-worker
          tar czf ${{ matrix.name }}-no-render.tar.gz -C dist/no-render obscura obscura-worker
          tar czf ${{ matrix.name }}-no-render-stealth.tar.gz -C dist/no-render-stealth obscura obscura-worker

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist/default
          7z a ../../${{ matrix.name }}.zip obscura.exe obscura-worker.exe
          cd ../stealth
          7z a ../../${{ matrix.name }}-stealth.zip obscura.exe obscura-worker.exe
          cd ../no-render
          7z a ../../${{ matrix.name }}-no-render.zip obscura.exe obscura-worker.exe
          cd ../no-render-stealth
          7z a ../../${{ matrix.name }}-no-render-stealth.zip obscura.exe obscura-worker.exe

      - name: Upload packaged binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}-stealth.tar.gz
            ${{ matrix.name }}-no-render.tar.gz
            ${{ matrix.name }}-no-render-stealth.tar.gz
            ${{ matrix.name }}.zip
            ${{ matrix.name }}-stealth.zip
            ${{ matrix.name }}-no-render.zip
            ${{ matrix.name }}-no-render-stealth.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # This job never checks out or executes repository code. The write token is
      # available only while collecting and publishing the completed artifacts.
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Revalidate or create release tag
        shell: bash
        env:
          ALLOW_CREATE_TAG: ${{ needs.prepare.outputs.create_tag }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          error_file="$RUNNER_TEMP/release-tag-error"
          if ! ref_json="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              2>"$error_file"
          )"; then
            if [[ "$ALLOW_CREATE_TAG" == "true" ]] \
              && grep -q 'HTTP 404' "$error_file"; then
              create_error="$RUNNER_TEMP/release-tag-create-error"
              if gh api --method POST \
                "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/$RELEASE_TAG" \
                -f sha="$EXPECTED_SHA" \
                >/dev/null 2>"$create_error"; then
                echo "Created tag $RELEASE_TAG at $EXPECTED_SHA"
              elif grep -q 'HTTP 422' "$create_error"; then
                echo "Tag $RELEASE_TAG was created concurrently; validating it"
              else
                cat "$create_error" >&2
                exit 1
              fi
              ref_json="$(
                gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
              )"
            else
              cat "$error_file" >&2
              exit 1
            fi
          fi

          object_type="$(jq -er '.object.type' <<<"$ref_json")"
          object_sha="$(jq -er '.object.sha' <<<"$ref_json")"
          for _ in {1..16}; do
            [[ "$object_type" == "commit" ]] && break
            if [[ "$object_type" != "tag" ]]; then
              echo "Tag $RELEASE_TAG resolves to unsupported object type $object_type" >&2
              exit 1
            fi
            tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -er '.object.type' <<<"$tag_json")"
            object_sha="$(jq -er '.object.sha' <<<"$tag_json")"
          done

          if [[ "$object_type" != "commit" || "$object_sha" != "$EXPECTED_SHA" ]]; then
            echo "Tag $RELEASE_TAG changed while building: expected $EXPECTED_SHA, got $object_type $object_sha" >&2
            exit 1
          fi
          echo "Tag $RELEASE_TAG still resolves to $EXPECTED_SHA"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS

      - name: Decide whether to generate release notes
        id: release_metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REQUEST_GENERATE_NOTES: ${{ needs.prepare.outputs.generate_notes }}
        run: |
          set -euo pipefail

          generate_notes=false
          if [[ "$REQUEST_GENERATE_NOTES" == "true" ]]; then
            error_file="$RUNNER_TEMP/release-lookup-error"
            if gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              >/dev/null 2>"$error_file"; then
              echo "Updating an existing release without regenerating its notes"
            elif grep -q 'HTTP 404' "$error_file"; then
              generate_notes=true
              echo "A new release will receive generated notes"
            else
              cat "$error_file" >&2
              exit 1
            fi
          fi
          printf 'generate_notes=%s\n' "$generate_notes" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          fail_on_unmatched_files: true
          files: dist/*
          generate_release_notes: ${{ steps.release_metadata.outputs.generate_notes }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}

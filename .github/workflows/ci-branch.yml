name: CI

on:
  push:
    branches:
      - main
      - VVDevelop
  workflow_dispatch:

# This workflow only runs trusted branch code or a maintainer-selected ref.
# It deliberately has no write token or repository secrets. Pull requests keep
# using ci.yml, whose base-revision policy and performance comparison are
# specific to the pull_request event.
permissions:
  contents: read

concurrency:
  group: branch-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  NO_PROXY: 127.0.0.1,localhost
  OPENSSL_NO_VENDOR: "1"

jobs:
  core:
    name: Branch / Core
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake libclang-dev libssl-dev llvm-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: nextest
          fallback: none

      - name: Build render release
        run: cargo build --locked --release -p obscura-cli --bins --features render

      - name: Test render configuration
        run: cargo nextest run --locked --release --features render --no-fail-fast

      - name: Build render and stealth release
        run: cargo build --locked --release -p obscura-cli --bins --features render,stealth

      - name: Test stealth transport
        run: |
          cargo nextest run --locked --release -p obscura-net --features stealth \
            --no-fail-fast -- --skip stealth_client_decodes_gzip_response
          OBSCURA_ALLOW_PRIVATE_NETWORK=1 cargo nextest run --locked --release \
            -p obscura-net --features stealth \
            stealth_client_decodes_gzip_response --no-fail-fast

      - name: Build no-render release
        run: cargo build --locked --release -p obscura-cli --bins --no-default-features

      - name: Test no-render configuration
        run: |
          cargo nextest run --locked --release -p obscura --no-fail-fast
          cargo nextest run --locked --release --workspace --exclude obscura \
            --exclude obscura-render \
            --no-default-features --no-fail-fast
          cargo check --locked --release -p obscura-render --no-default-features

      - name: Build no-render and stealth release
        run: cargo build --locked --release -p obscura-cli --bins --no-default-features --features stealth
